<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <title>Embedded POS Terminal</title>
  <!-- Terminal body -->
  <rect x="58" y="34" width="104" height="160" rx="18" fill="#3b4652"/>
  <rect x="58" y="34" width="104" height="160" rx="18" fill="none" stroke="#28313a" stroke-width="3"/>
  <!-- Touchscreen -->
  <rect x="70" y="48" width="80" height="70" rx="8" fill="#bfe8d6"/>
  <rect x="70" y="48" width="80" height="70" rx="8" fill="none" stroke="#28313a" stroke-width="2"/>
  <!-- Face on the screen, like the other project mascots -->
  <circle cx="96" cy="78" r="5" fill="#28313a"/>
  <circle cx="124" cy="78" r="5" fill="#28313a"/>
  <circle cx="97.6" cy="76.4" r="1.6" fill="#fff"/>
  <circle cx="125.6" cy="76.4" r="1.6" fill="#fff"/>
  <path d="M103 90q7 6 14 0" fill="none" stroke="#28313a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="86" cy="90" r="4.5" fill="#f4a7a7" opacity="0.7"/>
  <circle cx="134" cy="90" r="4.5" fill="#f4a7a7" opacity="0.7"/>
  <!-- Keypad -->
  <g fill="#5d6b78" stroke="#28313a" stroke-width="1.5">
    <rect x="74" y="130" width="18" height="12" rx="3"/>
    <rect x="101" y="130" width="18" height="12" rx="3"/>
    <rect x="128" y="130" width="18" height="12" rx="3"/>
    <rect x="74" y="148" width="18" height="12" rx="3"/>
    <rect x="101" y="148" width="18" height="12" rx="3"/>
    <rect x="128" y="148" width="18" height="12" rx="3"/>
  </g>
  <rect x="74" y="166" width="72" height="14" rx="4" fill="#6fcf97" stroke="#28313a" stroke-width="1.5"/>
  <!-- Card being tapped -->
  <g transform="rotate(-18 172 72)">
    <rect x="146" y="54" width="54" height="36" rx="6" fill="#f2c14e" stroke="#28313a" stroke-width="2.5"/>
    <rect x="154" y="64" width="12" height="9" rx="2" fill="#e8e1c8" stroke="#28313a" stroke-width="1.5"/>
    <rect x="154" y="80" width="30" height="3.5" rx="1.75" fill="#28313a" opacity="0.5"/>
  </g>
  <!-- NFC waves -->
  <g fill="none" stroke="#6fcf97" stroke-width="3" stroke-linecap="round">
    <path d="M150 104q6 6 0 12"/>
    <path d="M158 98q12 12 0 24"/>
    <path d="M166 92q18 18 0 36"/>
  </g>
  <!-- Sparkles -->
  <g fill="#9bd4b8">
    <path d="M40 60l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/>
    <path d="M182 160l2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2 4.5-2z"/>
  </g>
</svg>
